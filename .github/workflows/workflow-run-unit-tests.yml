name: 'Run Unit Tests'

on:
  workflow_call:
    inputs:
      python_runtime:
        description: 'Python version to use (e.g., 3.11)'
        required: true
        type: string
    secrets:
      STARTGG_API_KEY:
        description: 'start.gg API key for the live player tier check; without it that step skips'
        required: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python ${{ inputs.python_runtime }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_runtime }}

      - name: Install dependencies and run tests via Makefile
        run: make test

      - name: Lint via Makefile
        run: make lint

      # Real start.gg lookups for known players (tests/deferred_worker/
      # test_live_player_tiers.py). Prints a player / discriminator / roles
      # report to this log and the job summary, and fails on a mismatch.
      - name: Live player tiers (start.gg)
        env:
          STARTGG_API_KEY: ${{ secrets.STARTGG_API_KEY }}
        run: .venv/bin/pytest tests/deferred_worker/test_live_player_tiers.py -s -v

  terraform-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      # Syntax + reference check only: no backend, no AWS credentials. Runs
      # before deploy, so a broken reference fails here instead of mid-apply.
      - name: Validate terraform/infra
        working-directory: ./terraform/infra
        run: |
          terraform init -backend=false -input=false
          terraform validate
